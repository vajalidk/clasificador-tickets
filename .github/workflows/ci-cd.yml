name: CI/CD

# Corre en cualquier push (da feedback rapido en feature/* y develop) y en
# pull requests hacia main (gate de revision antes de mergear). El job de
# deploy esta restringido mas abajo a "push directo a main" unicamente.
on:
  push:
  pull_request:
    branches: [main]

# Evita que dos pushes seguidos a la misma rama corran el pipeline en
# paralelo y desperdicien minutos de Actions; el mas nuevo cancela al viejo.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black / isort / flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements-dev.txt

      - run: black --check .
      - run: isort --check .
      - run: flake8 .

  seguridad:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks escanea todo el historial, no solo el ultimo commit
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker-build:
    name: Build de la imagen Docker (validacion, sin push ni credenciales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen (no se publica a ningun registry)
        run: docker build -t clasificador-tickets:ci .

      - name: Smoke test - el contenedor arranca y responde HTTP
        run: |
          # No hay Postgres real en este runner, asi que /health respondera
          # 503 (documentado y esperado, ver app/routes.py). Lo que este
          # smoke test valida es que gunicorn/Flask arrancan dentro del
          # contenedor y sirven HTTP - no la conectividad a una DB real.
          docker run -d --name smoke -p 8080:8080 \
            -e DATABASE_URL="postgresql://usuario:password@host:5432/postgres" \
            clasificador-tickets:ci

          codigo="000"
          for i in $(seq 1 15); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || true)
            if [ "$codigo" != "000" ] && [ -n "$codigo" ]; then
              echo "Contenedor respondio HTTP $codigo en /health (503 es lo esperado sin DB real)"
              break
            fi
            sleep 2
          done

          docker logs smoke
          docker rm -f smoke

          if [ "$codigo" = "000" ] || [ -z "$codigo" ]; then
            echo "::error::El contenedor nunca respondio HTTP - revisar logs arriba"
            exit 1
          fi

  deploy:
    name: Build y deploy a Cloud Run
    needs: [lint, seguridad, tests, docker-build]
    # Solo se despliega en un push DIRECTO a main (nunca en un PR ni en
    # otras ramas). Si lint/seguridad/tests fallan, "needs" ya impide que
    # este job se ejecute - el pipeline completo queda en rojo y no
    # despliega, tal como pide la especificacion.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que los secrets de GCP esten configurados
        id: check
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "Faltan GCP_SA_KEY y/o GCP_PROJECT_ID como secrets de GitHub." >&2
            echo "El deploy se omite - ver seccion 7 del README para configurarlos." >&2
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Autenticar con Google Cloud
        if: steps.check.outputs.listo == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        if: steps.check.outputs.listo == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        if: steps.check.outputs.listo == 'true'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Crear repositorio en Artifact Registry si no existe
        if: steps.check.outputs.listo == 'true'
        run: |
          gcloud artifacts repositories describe clasificador-tickets \
            --location=us-central1 \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            || gcloud artifacts repositories create clasificador-tickets \
                 --repository-format=docker \
                 --location=us-central1 \
                 --project="${{ secrets.GCP_PROJECT_ID }}" \
                 --description="Imagenes del clasificador de tickets de soporte"

      - name: Build y push de la imagen Docker
        if: steps.check.outputs.listo == 'true'
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/clasificador-tickets/api
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "IMAGE_TAG=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Deploy a Cloud Run
        if: steps.check.outputs.listo == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: clasificador-tickets
          region: us-central1
          image: ${{ env.IMAGE_TAG }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          flags: --allow-unauthenticated
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            LOG_LEVEL=INFO
