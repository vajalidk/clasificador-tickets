<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Clasificador de Tickets</title>
  <!-- Chart.js via CDN: no requiere build step ni dependencias de pago -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1220;
      --card-bg: #1a1f36;
      --text: #e8eaf2;
      --text-muted: #9aa0b4;
      --border: #2a3050;
      --accent: #6c8cff;
      /* Paleta semantica de urgencia: fija en toda la app (dashboard +
         formulario de tickets) para que un mismo color siempre signifique
         lo mismo. Tonos suavizados para buen contraste sobre fondo oscuro. */
      --alta: #f0555a;
      --media: #f5b942;
      --baja: #3ecf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .contenedor-dashboard {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .encabezado {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
    p.subtitulo { color: var(--text-muted); margin: 0; }
    .enlace-ticket {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .enlace-ticket:hover { text-decoration: underline; }

    .resumen {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .tarjeta-resumen {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 0;
    }
    .tarjeta-resumen .valor {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tarjeta-resumen .valor.alta { color: var(--alta); }
    .tarjeta-resumen .etiqueta { color: var(--text-muted); font-size: 0.82rem; margin-top: 4px; }

    .grid-graficas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .tarjeta-grafica {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-width: 0;
    }
    .tarjeta-grafica.ancha { grid-column: 1 / -1; }
    .tarjeta-grafica h2 {
      font-size: 1rem;
      margin: 0 0 12px 0;
      color: var(--text-muted);
      font-weight: 600;
    }
    .lienzo-grafica { position: relative; height: 260px; }
    .lienzo-grafica.tendencia { height: 240px; }

    .tarjeta-tabla {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      overflow-x: auto;
    }
    .tarjeta-tabla h2 {
      font-size: 1rem;
      margin: 0 0 14px 0;
      color: var(--text-muted);
      font-weight: 600;
    }
    table.recientes { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 480px; }
    table.recientes th {
      text-align: left;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0 12px 10px 0;
      border-bottom: 1px solid var(--border);
    }
    table.recientes td {
      padding: 10px 12px 10px 0;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.recientes tr:last-child td { border-bottom: none; }
    .texto-truncado {
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      vertical-align: middle;
    }
    .badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge.categoria { background: rgba(108, 140, 255, 0.15); color: var(--accent); }
    .badge.urgencia-alta { background: rgba(240, 85, 90, 0.15); color: var(--alta); }
    .badge.urgencia-media { background: rgba(245, 185, 66, 0.15); color: var(--media); }
    .badge.urgencia-baja { background: rgba(62, 207, 142, 0.15); color: var(--baja); }

    .estado-carga { color: var(--text-muted); font-size: 0.9rem; }
    .sin-datos { color: var(--text-muted); font-size: 0.85rem; padding: 8px 0; }

    /* Responsive: se explicitan los puntos de quiebre en vez de depender
       solo de auto-fit/minmax, para que el layout no se vea "raro" a
       anchos intermedios (ej. media pantalla en un monitor grande). */
    @media (max-width: 980px) {
      .grid-graficas { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .resumen { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .contenedor-dashboard { padding: 16px; }
      .resumen { grid-template-columns: 1fr; }
      .tarjeta-resumen .valor { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="contenedor-dashboard">
    <div class="encabezado">
      <div>
        <h1>Panel de estadisticas</h1>
        <p class="subtitulo">Clasificacion de tickets de soporte al cliente</p>
      </div>
      <a href="/nuevo-ticket" class="enlace-ticket">+ Enviar un ticket</a>
    </div>

    <div class="resumen" id="resumen">
      <div class="tarjeta-resumen">
        <div class="valor" id="valor-total">-</div>
        <div class="etiqueta">Tickets totales</div>
      </div>
      <div class="tarjeta-resumen">
        <div class="valor" id="valor-categoria-top">-</div>
        <div class="etiqueta">Categoria top</div>
      </div>
      <div class="tarjeta-resumen">
        <div class="valor alta" id="valor-urgencia-alta">-</div>
        <div class="etiqueta">Urgencia alta</div>
      </div>
      <div class="tarjeta-resumen">
        <div class="valor" id="valor-confianza-prom">-</div>
        <div class="etiqueta">Confianza prom.</div>
      </div>
    </div>

    <div class="grid-graficas">
      <div class="tarjeta-grafica">
        <h2>Tickets por categoria</h2>
        <div class="lienzo-grafica"><canvas id="grafica-categoria"></canvas></div>
      </div>
      <div class="tarjeta-grafica">
        <h2>Tickets por urgencia</h2>
        <div class="lienzo-grafica"><canvas id="grafica-urgencia"></canvas></div>
      </div>
      <div class="tarjeta-grafica ancha">
        <h2>Tickets por dia · ultimos 7 dias</h2>
        <div class="lienzo-grafica tendencia"><canvas id="grafica-tendencia"></canvas></div>
      </div>
    </div>

    <div class="tarjeta-tabla">
      <h2>Clasificaciones recientes</h2>
      <div id="contenedor-recientes"></div>
    </div>

    <p class="estado-carga" id="estado-carga"></p>
  </div>

  <script>
    const DIAS_SEMANA = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
    const URGENCIA_COLOR = { alta: "#f0555a", media: "#f5b942", baja: "#3ecf8e" };
    const URGENCIA_ORDEN = ["alta", "media", "baja"];
    const COLOR_TEXTO_MUTED = "#9aa0b4";
    const COLOR_GRID = "rgba(255, 255, 255, 0.06)";

    // Chart.js no puede leer variables CSS (corre en <canvas>), asi que
    // los colores de ejes/leyendas se fijan aqui una sola vez para que
    // todas las graficas compartan la misma paleta legible sobre fondo oscuro.
    Chart.defaults.color = COLOR_TEXTO_MUTED;
    Chart.defaults.borderColor = COLOR_GRID;
    Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

    function capitalizar(texto) {
      if (!texto) return texto;
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function etiquetaDia(fechaIso) {
      // fechaIso viene como "YYYY-MM-DD" (DATE de Postgres serializado).
      // Se parsea como UTC explicitamente para que el dia de la semana no
      // dependa de la zona horaria del navegador de quien ve el dashboard.
      const partes = fechaIso.split("-").map(Number);
      const fecha = new Date(Date.UTC(partes[0], partes[1] - 1, partes[2]));
      return DIAS_SEMANA[fecha.getUTCDay()];
    }

    async function cargarEstadisticas() {
      const estadoEl = document.getElementById("estado-carga");
      try {
        const resp = await fetch("/api/estadisticas");
        if (!resp.ok) {
          const cuerpo = await resp.json().catch(() => ({}));
          throw new Error(cuerpo.error || `Error HTTP ${resp.status}`);
        }
        const datos = await resp.json();
        renderizar(datos);
        estadoEl.textContent = "";
      } catch (err) {
        estadoEl.textContent = `No se pudieron cargar las estadisticas: ${err.message}`;
      }
    }

    function renderizarResumen(datos) {
      document.getElementById("valor-total").textContent = datos.total_clasificaciones ?? 0;

      const categorias = datos.por_categoria || [];
      const categoriaTop = categorias.length
        ? categorias.reduce((max, c) => (c.total > max.total ? c : max), categorias[0])
        : null;
      document.getElementById("valor-categoria-top").textContent = categoriaTop
        ? capitalizar(categoriaTop.categoria)
        : "-";

      const urgencias = datos.por_urgencia || [];
      const urgenciaAlta = urgencias.find((u) => u.urgencia === "alta");
      document.getElementById("valor-urgencia-alta").textContent = urgenciaAlta
        ? urgenciaAlta.total
        : 0;

      const confianzaProm = datos.confianza_promedio;
      document.getElementById("valor-confianza-prom").textContent =
        confianzaProm === null || confianzaProm === undefined
          ? "N/D"
          : confianzaProm.toFixed(2);
    }

    function renderizarGraficas(datos) {
      const categorias = datos.por_categoria || [];
      new Chart(document.getElementById("grafica-categoria"), {
        type: "bar",
        data: {
          labels: categorias.map((c) => capitalizar(c.categoria)),
          datasets: [{
            label: "Tickets",
            data: categorias.map((c) => c.total),
            backgroundColor: "#6c8cff",
            borderRadius: 4,
            maxBarThickness: 32,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: COLOR_GRID } },
            x: { grid: { display: false } },
          },
        },
      });

      // Orden y color fijos (alta/media/baja) para que la leyenda y los
      // colores sean siempre los mismos sin importar el orden de los
      // datos que devuelve la API.
      const urgenciasPorClave = Object.fromEntries(
        (datos.por_urgencia || []).map((u) => [u.urgencia, u.total])
      );
      const urgenciasOrdenadas = URGENCIA_ORDEN.filter((u) => u in urgenciasPorClave);

      new Chart(document.getElementById("grafica-urgencia"), {
        type: "doughnut",
        data: {
          labels: urgenciasOrdenadas.map((u) => capitalizar(u)),
          datasets: [{
            data: urgenciasOrdenadas.map((u) => urgenciasPorClave[u]),
            backgroundColor: urgenciasOrdenadas.map((u) => URGENCIA_COLOR[u]),
            borderColor: "#1a1f36",
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10 } } },
        },
      });

      const porDia = datos.por_dia || [];
      new Chart(document.getElementById("grafica-tendencia"), {
        type: "line",
        data: {
          labels: porDia.map((d) => etiquetaDia(d.dia)),
          datasets: [{
            label: "Tickets clasificados",
            data: porDia.map((d) => d.total),
            borderColor: "#6c8cff",
            backgroundColor: "rgba(108, 140, 255, 0.1)",
            borderWidth: 2,
            pointBackgroundColor: "#6c8cff",
            pointBorderColor: "#1a1f36",
            pointBorderWidth: 2,
            pointRadius: 4,
            fill: true,
            tension: 0.35,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: COLOR_GRID } },
            x: { grid: { display: false } },
          },
        },
      });
    }

    function badgeUrgencia(urgencia) {
      const clase = { alta: "urgencia-alta", media: "urgencia-media", baja: "urgencia-baja" }[urgencia] || "urgencia-media";
      return `<span class="badge ${clase}">${capitalizar(urgencia)}</span>`;
    }

    function escaparHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }

    function renderizarRecientes(datos) {
      const contenedor = document.getElementById("contenedor-recientes");
      const filas = datos.recientes || [];

      if (!filas.length) {
        contenedor.innerHTML = '<p class="sin-datos">Aun no hay clasificaciones registradas.</p>';
        return;
      }

      const filasHtml = filas.map((r) => `
        <tr>
          <td><span class="texto-truncado" title="${escaparHtml(r.texto)}">${escaparHtml(r.texto)}</span></td>
          <td><span class="badge categoria">${escaparHtml(capitalizar(r.categoria))}</span></td>
          <td>${badgeUrgencia(r.urgencia)}</td>
          <td>${Number(r.confianza).toFixed(2)}</td>
        </tr>
      `).join("");

      contenedor.innerHTML = `
        <table class="recientes">
          <thead>
            <tr><th>Texto</th><th>Categoria</th><th>Urgencia</th><th>Confianza</th></tr>
          </thead>
          <tbody>${filasHtml}</tbody>
        </table>
      `;
    }

    function renderizar(datos) {
      renderizarResumen(datos);
      renderizarGraficas(datos);
      renderizarRecientes(datos);
    }

    cargarEstadisticas();
  </script>
</body>
</html>
